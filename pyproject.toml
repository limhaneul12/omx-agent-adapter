[project]
name = "agent-remote"
version = "0.1.0"
description = "Agent-facing adapter layer for operating OMX as a stateful runtime"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "msgspec>=0.19,<1.0",
  "orjson>=3.10,<4.0",
  "pydantic>=2.11,<3.0",
  "typer>=0.16,<1.0",
  "typing-extensions>=4.14,<5.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=6.3.0",
  "pyrefly>=0.62.0",
  "ruff>=0.15.9",
]

[project.scripts]
agent-remote = "omx_agent_adapter_cli:app"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/omx_remote/**/*.py",
  "omx_agent_adapter_cli.py",
  "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omx_remote"]
force-include = {"omx_agent_adapter_cli.py" = "omx_agent_adapter_cli.py"}

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
  ".venv",
  ".ruff_cache",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PERF", "N", "RUF"]
ignore = [
  "E501",
  "B008",
  "SIM108",
]
exclude = [
  "**/tests/**",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
python-version = "3.13"
project-includes = ["src/omx_remote"]
project-excludes = [
  "**/tests/**",
  "**/__pycache__",
  "**/.venv/**",
  "**/venv/**",
  "**/.mypy_cache/**",
  "**/.ruff_cache/**",
  "**/build/**",
  "**/dist/**",
  "**/.pytest_cache/**",
  "**/.git/**",
]
search-path = ["src/omx_remote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/omx_remote"]
addopts = "--strict-markers"
norecursedirs = [".venv", ".pytest_cache", ".ruff_cache", "node_modules"]
