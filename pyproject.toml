[project]
name = "comx-agent"
version = "0.2.0"
description = "Local Agent Development Environment for Codex and OMX"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "orjson>=3.10,<4.0",
  "pydantic>=2.11,<3.0",
  "typer>=0.16,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pyrefly>=0.62.0",
  "ruff>=0.15.9",
]

[project.scripts]
comx-agent = "comx_harness.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/comx_harness/**/*.py",
  "README.md",
  "GOAL.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/comx_harness"]
force-include = {"GOAL.md" = "GOAL.md"}

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src/comx_harness", "tests/harness"]
include = [
  "src/comx_harness/**/*.py",
  "tests/harness/**/*.py",
]
extend-exclude = [
  ".venv",
  ".ruff_cache",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PERF", "N", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
python-version = "3.13"
project-includes = ["src/comx_harness"]
project-excludes = [
  "**/tests/**",
  "**/__pycache__",
  "**/.venv/**",
  "**/build/**",
  "**/dist/**",
  "**/.git/**",
]
search-path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/harness"]
pythonpath = ["src"]
addopts = "--strict-markers -m 'not native'"
markers = [
  "native: requires installed provider binaries and ambient native runtime state",
]
norecursedirs = [".venv", ".pytest_cache", ".ruff_cache", "node_modules"]
